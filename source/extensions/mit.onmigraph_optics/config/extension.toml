[package]
title = "OmniGraph Optics"
version = "0.1.0"  # Semantic Versioning is used: https://semver.org/
description = "OmniGraph-based optical system visualization for MZIs, Michelson interferometers, and other optical setups"
category = "Physics"  # How to categorize this in the Extension Manager
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"  # Icon to show in the Extension Manager
keywords = ["omnigraph", "optics", "physics", "interferometer", "simulation"]  # Search keywords for the Extension Manager
preview_image = "data/preview.png"  # Preview to show in the Extension Manager
readme  = "docs/README.md"  # Path (relative to the root) or content of readme markdown file for UI
repository = "https://github.com/NVIDIA-Omniverse/kit-app-template"  # URL of the extension source repository


[dependencies]
"omni.ui" = {}
"omni.usd" = {}
"omni.kit.commands" = {}


[settings]


[[python.module]]  # Main python module this extension provides, it will be publicly available as "import mit.onmigraph_optics"
name = "mit.onmigraph_optics"


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]


[[test]]
dependencies = [
]

args = [
]